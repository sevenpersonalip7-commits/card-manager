<!DOCTYPE html>
<html lang="ja">

<!-- ページのメタデータ -->
<head>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
 <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>カード管理</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>

<!-- ページの本文 -->
<body>
  <!-- アプリケーションコンテナ -->
    <div id="app">
      <!-- ローディング画面 -->
    <div id="loading-screen" >
      <!-- ローディングアイコン -->
      <div class="loading-icon-wrap">
        <!-- アイコン画像 -->
        <img src="icon.svg" width="80" height="80" class="loading-icon">
      </div>
      <!-- ローディングテキスト -->
      <div class="loading-title">カード管理</div>
      <!-- プログレスバー -->
      <div class="loading-progress">
        <div id="progress-bar"></div>
      </div>
    </div>
  </div>

 <!-- ログイン画面テンプレート -->
  <template id="tmpl-login">
    <!-- ログイン画面の土台 -->
    <div class="login-page">
      <!-- ログインフォーム -->
      <div class="login-box">
        <div class="login-header">
          <div class="login-logo">💳</div>
          <h1 class="login-title">カード管理</h1>
        </div>
        <!-- ログインフォームの背景とパディング -->
                <div class="login-form">
          <!-- メールアドレス入力欄 -->
                  <div class="form-group">
            <label class="form-label">メールアドレス</label>
            <input class="form-input" id="login-email" type="email" placeholder="example@email.com">
          </div>
          <!-- パスワード入力欄 -->
          <div class="form-group">
            <label class="form-label">パスワード</label>
            <input class="form-input" id="login-password" type="password" placeholder="パスワード">
          </div>
          <!-- ログインエラーメッセージ -->
          <div id="login-error" class="login-error" style="display:none">
            メールアドレスまたはパスワードが違います
          </div>
          <!-- ログインボタン -->
          <button id="btn-login" class="btn btn-primary btn-full" >ログイン</button>
        </div>
      </div>
    </div>
  </template>

  <!-- アプリメイン全体のテンプレート -->
<template id="tmpl-app">
  <div class="header">
    <!-- ハンバーガーメニュー -->
<button id="btn-hamburger">
      <i class="ph-bold ph-list"></i>
    </button>
    <h1>💳 カード管理</h1>
    <div class="header-spacer"></div>
  </div>

  <!-- オーバーレイ -->
  <div id="drawer-overlay" style="display:none"></div>

  <!-- ドロワー -->
  <div id="drawer">
    <div class="drawer-user">
      <div class="drawer-user-label">ログイン中</div>
      <div id="drawer-email"></div>
    </div>

    <!-- ドロワーナビ挿入用 -->
    <nav id="drawer-nav"></nav>
    
    <div class="drawer-footer">
      <div id="last-updated"></div>
      <button id="btn-check-update" class="btn btn-ghost btn-full">
        <i class="ph-bold ph-arrow-clockwise"></i> 更新を確認
      </button>      
      <button id="btn-logout" class="btn btn-danger btn-full">
        <i class="ph-bold ph-sign-out"></i> ログアウト
      </button>
    </div>
  </div>

  <!-- メインコンテンツ領域 -->
  <div class="main" id="main-content"></div>

  <!-- ボトムナビ挿入用 -->
  <nav class="bottom-nav" id="bottom-nav"></nav>

  <!-- FAB（プラスボタン）領域 -->
  <div id="fab-container"></div>
</template>

<!-- ドロワーボタン単体のテンプレート -->
<template id="tmpl-drawer-item">
  <button class="drawer-item">
    <i class="ph-bold"></i><span class="item-label"></span>
  </button>
</template>

<!-- ボトムナビボタン単体のテンプレート -->
<template id="tmpl-bottom-nav-item">
  <button>
    <i class="ph-bold"></i><span class="item-label"></span>
  </button>
</template>

<!-- FAB（＋）ボタン単体のテンプレート -->
<template id="tmpl-fab">
  <button id="btn-fab" class="fab" >
    <i class="ph-bold ph-plus"></i>
  </button>
</template>



<!-- ホーム画面全体の土台 -->
<template id="tmpl-home">
  <div>
    <!-- 月切り替えナビ -->
    <div class="month-nav">
      <button id="btn-prev-month"> &lt;</button>
      <span class="month-label"></span>
      <button id="btn-next-month"> &gt;</button>
    </div>

<!--今月ボタン（現在の月を表示）-->
  <div class="month-sub-nav">
    <button id="btn-current-month">今月</button>
  </div>

    <!-- 月間合計サマリー -->
    <div class="card">
      <div class="summary-amount"></div>
      <div class="summary-sub"></div>
    </div>

 <!-- 一括開閉・並び替え領域 -->
    <div class="toggle-buttons home-toggle-buttons" style="display:none">
      <!-- 開閉ボタン -->
      <button id="btn-expand-all" class="btn btn-ghost home-toggle-btn">
        <i class="ph-bold ph-arrows-out"></i> 全て開く
      </button>
      <button id="btn-collapse-all" class="btn btn-ghost home-toggle-btn">
        <i class="ph-bold ph-arrows-in"></i> 全て閉じる
      </button>

<!-- ソート項目選択（onchange を削除） -->
<select id="home-sort-key">
    <option value="dueDate">引き落とし日</option>
  <option value="amount">金額</option>
  <option value="name">カード名</option>
  <option value="count">件数</option>
</select>
<!-- 昇順/降順切替ボタン（ついでにIDをつけておく） -->
<button id="home-sort-order-btn" class="btn btn-ghost" title="昇順/降順切り替え">
  <i class="ph-bold ph-sort-descending" id="home-sort-order-icon"></i> <span id="home-sort-order-text">昇順</span>
</button>
    <!-- カテゴリチャート描画領域 -->
    <div class="chart-container"></div>
    <!-- データなし表示（初期状態は隠す） -->
    <div class="no-data card text-center" style="display:none">データがありません</div>
    <!-- カードグループリスト挿入用 -->
    <div class="card-groups-container"></div>
  </div>
</template>


<!--口座グループのテンプレート-->
<template id="tmpl-account-group">
  <div class="account">
    <!--ヘッダー行-->
    <div class="account-header">
      <!-- 1列目：矢印アイコン -->
      <i class="toggle-icon ph-bold"></i>
      <!-- 2列目：口座名 -->
      <span class="account-name"></span>
      <!-- 3列目：合計金額 -->
      <span class="account-total-amount"></span>
    </div>
    <!-- カードグループ等を入れるコンテナ -->
    <div class="account-cards-container"></div>
  </div>
</template>

<!-- カードラベルグループのテンプレート -->
<template id="tmpl-card-group">
  <div class="card-group">
    <!-- ヘッダー行 -->
    <div class="card-total-row">
      <!-- 1列目：矢印アイコン -->
      <i class="toggle-icon ph-bold"></i>
      <!-- 2列目：カード名 -->
      <span class="card-name"></span>
      <!-- 3列目：日付 -->
      <span class="card-date"></span>
      <!-- 4列目：件数 -->
      <span class="card-count"></span>
      <!-- 5列目：合計金額 -->
      <span class="card-total-amount"></span>
    </div>
    
    <!-- ボディ部分 -->
    <div class="card-group-body">
      <!-- カードラベルグループ内のソート部分 -->
      <div class="tmpl-tran-sort-order">
        <select class="home-tran-sort-key">
          <option value="usedDate">利用日</option>
          <option value="amount">金額</option>
          <option value="shop">購入先</option>
        </select>
        <button class="btn btn-ghost home-tran-sort-order-btn" title="昇順/降順切り替え">
          <i class="ph-bold ph-sort-descending home-tran-sort-order-icon"></i> 
          <span class="home-tran-sort-order-text">昇順</span>
        </button>
      </div>
      <!-- 明細リスト挿入用 -->
      <div class="card-transactions"></div>
    </div>
  </div>
</template>

<!-- 明細（1件分）のテンプレート -->
<template id="tmpl-transaction-item">
  <div class="transaction-item">
    <div class="transaction-info">
      <div class="shop">
        <span class="shop-name"></span>
        <span class="badge"></span>
        <span class="badge-category"></span>
      </div>
      <div class="date-category tx-meta-text"></div>
      <div class="tx-detail tx-meta-text" style="display:none"></div>
    </div>
    <div class="transaction-amount"></div>
  </div>
</template>

<!-- 定期支払い1行パーツ（ホーム画面用） -->
<template id="tmpl-home-recurring-item">
  <div class="home-recurring-item">
    <div class="home-recurring-info">
      <span class="rec-name"></span>
      <div class="rec-meta"></div>
    </div>
    <div class="home-recurring-right">
      <div class="rec-amount"></div>
    </div>
  </div>
</template>

























<!-- カテゴリグラフ全体の枠組み -->
<template id="tmpl-category-chart">
  <div class="card chart-card">
    <!-- ヘッダー行：クリックで開閉、右端に合計金額表示 -->
    <button id="btn-toggle-category-chart" class="chart-header">
      <!-- 左側のアイコン＋ラベル --> 
      <div class="toggle-header-left">
        <!-- アイコン -->
        <i class="toggle-icon ph-bold"></i>
        <!-- ラベル -->
        <span class="chart-header-label">カテゴリ別集計</span>
      </div>
      <!-- 右端の合計金額表示 -->
      <span class="chart-total-amount"></span>
    </button>
      <div id="category-chart-body">
      <div class="bars-container">
      </div>
      </div>
  </div>
</template>

<!-- カテゴリ1行分のパーツ -->
<template id="tmpl-category-bar">
  <div class="legend-item">
    <div class="legend-body">
      <div class="legend-row">
        <div class="legend-left">
          <div class="legend-dot"></div>
          <span class="legend-label"></span>
        </div>
        <div class="legend-right">
          <span class="legend-amount"></span>
          <span class="legend-percent"></span>
        </div>
      </div>
      <div class="progress-track">
        <div class="progress-bar-fill"></div>
      </div>
    </div>
  </div>
</template>

<!-- カテゴリ詳細画面の土台 -->
<template id="tmpl-category-detail">
  <div>
    <!-- ヘッダー部分 -->
    <div class="detail-header">
      <button class="btn-back">
        <i class="ph-bold ph-arrow-left"></i>
      </button>
      <div>
        <div class="category-name"></div>
        <div class="target-month"></div>
      </div>
      <div class="category-total"></div>
    </div>

    <!-- データなし表示（初期状態は非表示） -->
    <div class="no-data card text-center" style="display:none">データがありません</div>

    <!-- 明細リスト挿入用 -->
    <div class="tx-list-container"></div>
  </div>
</template>

<!-- 月別一覧画面の土台 -->
<template id="tmpl-monthly">
  <div>
    <h2 class="page-title">月別引き落とし一覧</h2>

    <!-- 一括開閉ボタン領域（データがある時のみ表示） -->
    <div class="toggle-buttons monthly-toggle-buttons" style="display:none">
      <button  id="btn-expand-all-years" class="btn btn-ghost monthly-toggle-btn" >
        <i class="ph-bold ph-arrows-out"></i> 全て開く
      </button>
      <button id="btn-collapse-all-years" class="btn btn-ghost monthly-toggle-btn">
        <i class="ph-bold ph-arrows-in"></i> 全て閉じる
      </button>
    </div>

    <!-- データなし表示（初期状態は隠す） -->
    <div class="no-data card text-center" style="display:none">データがありません</div>

    <!-- 年別グループ挿入用 -->
    <div class="years-container"></div>
  </div>
</template>

<!-- 年ごとのアコーディオン枠パーツ -->
<template id="tmpl-year-group">
  <div class="card year-card">
    <!-- 年ヘッダー -->
    <div class="year-header">
      <div class="toggle-header-left">
        <i class="toggle-icon ph-bold"></i>
        <span class="year-label"></span>
      </div>
      <span class="year-total-amount"></span>
    </div>
    <!-- 月別リスト格納部 -->
    <div class="year-body"></div>
  </div>
</template>

<!-- 月別1行分パーツ -->
<template id="tmpl-month-item">
  <div class="month-item">
    <span class="month-label"></span>
    <span class="month-amount"></span>
  </div>
</template>

<!-- 予約・未確定管理画面の土台 -->
<template id="tmpl-reserved">
  <div>
    <h2 class="page-title">予約・未確定管理</h2>

    <!-- データなし表示（初期状態は隠す） -->
    <div class="no-data card text-center" style="display:none">未確定データはありません</div>

    <!-- 未確定明細リスト挿入用 -->
    <div class="reserved-list-container"></div>
  </div>
</template>

<!-- 未確定明細1件分のパーツ -->
<template id="tmpl-reserved-item">
  <div class="card reserved-card">
    <!-- メイン情報（タップで編集） -->
    <div class="reserved-header">
      <div class="reserved-main">
        <div class="shop"></div>
        <div class="date-card-category"></div>
      </div>
      <div class="transaction-amount"></div>
    </div>

    <!-- 詳細領域（テキストがある場合のみ表示） -->
    <div class="detail-section" style="display:none">
      <!-- テキスト部分：white-space: pre-wrap で改行をそのまま保持。初期表示は2行制限 -->
      <div class="detail-text detail-text-clamp"></div>
      <!-- コンパクトな開閉リンク -->
      <div class="toggle-detail-btn" style="display:none">
        <span class="toggle-label">
          もっと見る <i class="ph-bold ph-caret-down"></i>
        </span>
      </div>
    </div>
  </div>
</template>

<!-- 定期支払い管理画面の土台 -->
<template id="tmpl-recurring">
  <div>
    <h2 class="page-title">定期支払い管理</h2>
    <button id="btn-add-recurring" class="btn btn-primary btn-full btn-add-item" >
      ＋ 定期支払いを追加
    </button>

    <!-- データなし表示（初期状態は隠す） -->
    <div class="no-data card text-center" style="display:none">定期支払いが登録されていません</div>

    <!-- 定期支払いリスト挿入用 -->
    <div class="recurring-list-container"></div>
  </div>
</template>

<!-- 定期支払い1件分のパーツ -->
<template id="tmpl-recurring-item">
  <div class="card recurring-card">
    <div class="recurring-card-row">
      <div class="recurring-info">
        <div class="recurring-title-row">
          <span class="recurring-name"></span>
          <!-- バッジ挿入領域 -->
          <span class="badge-status-container"></span>
        </div>
        <div class="recurring-meta"></div>
        <div class="recurring-memo" style="display:none"></div>
      </div>
      <div class="recurring-side">
        <div class="recurring-amount"></div>
      </div>
    </div>
  </div>
</template>

<!-- 定期支払い追加・編集モーダルのテンプレート -->
<template id="tmpl-recurring-modal">
  <div class="modal-overlay">
    <div class="modal">
      <div class="modal-title"></div>

      <div class="form-group">
        <label class="form-label">名称 *</label>
        <input class="form-input" id="rec-name" placeholder="例：家賃・電気代">
      </div>

      <div class="form-group">
        <label class="form-label">金額（円） *</label>
        <input class="form-input" id="rec-amount" type="number" placeholder="例：50000">
      </div>

      <div class="form-group">
        <label class="form-label">引き落とし口座</label>
        <select class="form-input" id="rec-bank">
          <option value="">未設定</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">引き落とし日 *</label>
        <input class="form-input" id="rec-day" type="number" min="1" max="31" placeholder="例：27">
      </div>

      <div class="form-group">
        <label class="form-label">頻度 *</label>
        <select class="form-input" id="rec-frequency"></select>
      </div>

      <div class="form-group">
        <label class="form-label">開始日 *</label>
        <input class="form-input" id="rec-start" type="date">
      </div>

      <div class="form-group">
        <label class="form-label">メモ</label>
        <input class="form-input" id="rec-memo" placeholder="任意メモ">
      </div>

      <div class="form-group form-group-check">
        <input type="checkbox" id="rec-active">
        <label for="rec-active" class="form-label">有効（オン）</label>
      </div>

      <!-- 編集時のみ表示する削除チェックボックス -->
      <div class="delete-check" style="display:none">
        <input type="checkbox" id="rec-delete">
        <label for="rec-delete">この定期支払いを削除する</label>
      </div>

      <div class="modal-actions">
        <button id="btn-cancel" class="btn btn-ghost" >キャンセル</button>
        <button id="btn-save-recurring" class="btn btn-primary btn-save">保存</button>
      </div>
    </div>
  </div>
</template>

<!-- select要素のoptionパーツ -->
<template id="tmpl-option">
  <option></option>
</template>

<!-- 1. 口座管理画面の土台 -->
<template id="tmpl-banks">
  <div>
    <h2 class="page-title">口座管理</h2>
    <button id="btn-add-bank" class="btn btn-primary btn-full mt-8 btn-add-item">
      ＋ 口座を追加
    </button>

    <!-- データなし表示（初期状態は非表示） -->
    <div class="no-data card text-center" style="display:none">口座が登録されていません</div>

    <!-- 口座カードリスト挿入用 -->
    <div class="bank-list-container"></div>
  </div>
</template>

<!-- 2. 口座1つ分のカードパーツ -->
<template id="tmpl-bank-card">
  <div class="card bank-card">
    <!-- 口座基本情報 -->
    <div class="bank-header">
      <div>
        <div class="bank-name"></div>
        <div class="bank-balance-label">残高</div>
      </div>
      <div class="bank-header-right">
        <div class="bank-balance"></div>
        <button class="btn btn-ghost btn-edit-bank">
          <i class="ph-bold ph-pencil"></i> 編集
        </button>
      </div>
    </div>

    <!-- 今月の定期支払いセクション（該当がある場合のみ表示） -->
    <div class="recurring-section" style="display:none">
      <div class="section-label">今月の定期支払い</div>
      <div class="recurring-list"></div>
    </div>

    <!-- 今月のカード引き落とし予定セクション -->
    <div class="card-billing-section">
      <div class="section-label">今月の引き落とし予定</div>
      <div class="card-billing-list"></div>

      <!-- 金額サマリーエリア -->
      <div class="billing-summary">
        <!-- 1. 支払予定合計（済・未にかかわらない総額） -->
        <div class="billing-total-row">
          <div class="billing-total-label">支払予定合計</div>
          <div class="total-billing-amount"></div>
        </div>

        <!-- 2. 内訳（未引き落とし分 / 処理済み分） -->
        <div class="billing-breakdown">
          <span>未引き落とし分: <strong class="unprocessed-billing-amount">¥0</strong></span>
          <span>処理済み分: <strong class="processed-billing-amount">¥0</strong></span>
        </div>
      </div>

      <!-- 残高判定ボックス（今後の未引き落とし分に対する判定） -->
      <div class="status-box">
        <div class="status-label"></div>
        <div class="status-amount"></div>
      </div>

      <!-- 確定レコード作成ボタン -->
      <button class="btn btn-primary btn-full btn-create-record" style="display:none">
        <i class="ph-bold ph-check-circle"></i> 引き落とし確定レコードを作成
      </button>
    </div>

    <!-- 紐付きカードがない場合表示 -->
    <div class="no-linked-cards" style="display:none">紐付きカードなし</div>
  </div>
</template>

<!-- 3.定期支払い1行パーツ -->
<template id="tmpl-bank-recurring-item">
  <div class="recurring-item">
    <div class="recurring-info">
      <div class="recurring-main">
        <span class="rec-name"></span>
        <span class="badge-off" style="display:none;">停止中</span>
        <span class="badge-processed" style="display:none;">処理済</span>
      </div>
      <div class="rec-meta"></div>
    </div>
    <!-- 右側エリア：相対配置にして右端に固定枠を確保 -->
    <div class="recurring-right-area">
      <div class="rec-amount"></div>
      <!-- ボタンは絶対配置で右端に固定（非表示でも金額の位置に影響しない） -->
      <button class="btn btn-ghost btn-process" style="display:none;">処理</button>
    </div>
  </div>
</template>

<!-- 4. カード引き落とし1行パーツ -->
<template id="tmpl-bank-card-item">
  <div class="bank-card-item">
    <div>
      <div class="bank-card-name-row">
        <span class="card-name"></span>
        <span class="badge-card-processed" style="display:none">処理済</span>
      </div>
      <div class="billing-date-text"></div>
    </div>
    <!-- 右側エリア：相対配置にして右端に固定枠を確保 -->
    <div class="bank-card-item-right">
      <div class="billing-amount"></div>
      <!-- ボタンは絶対配置で右端に固定（非表示でも金額の位置に影響しない） -->
      <button class="btn btn-ghost btn-process-card" style="display:none">処理</button>
    </div>
  </div>
</template>

<!-- 口座追加・編集モーダルのテンプレート -->
<template id="tmpl-bank-modal">
  <div class="modal-overlay">
    <div class="modal">
      <div class="modal-title"></div>

      <div class="form-group">
        <label class="form-label">口座名 *</label>
        <input class="form-input" id="bank-name" placeholder="例：楽天銀行">
      </div>

      <div class="form-group">
        <label class="form-label">残高（円） *</label>
        <input class="form-input" id="bank-balance" type="number" placeholder="例：100000">
      </div>

      <!-- 編集時のみ表示する削除チェックボックス -->
      <div class="delete-check" style="display:none">
        <input type="checkbox" id="bank-delete">
        <label for="bank-delete">この口座を削除する</label>
      </div>

      <div class="modal-actions">
        <button id="btn-cancel" class="btn btn-ghost" >キャンセル</button>
        <button id="btn-save-bank" class="btn btn-primary btn-save">保存</button>
      </div>
    </div>
  </div>
</template>

<!-- カード管理画面の土台 -->
<template id="tmpl-cards">
  <div>
    <h2 class="page-title page-title-bold">カード管理</h2>
    <button id="btn-add-card" class="btn btn-primary btn-full mt-8" >＋ カードを追加</button>
    
    <div class="mt-16 card-list-container">
      <!-- データなし表示（初期状態は非表示） -->
      <div class="no-data card text-center" style="display:none">カードが登録されていません</div>
    </div>
  </div>
</template>

<!-- カード1件分のパーツ -->
<template id="tmpl-card-item">
  <div class="card transaction-item">
    <div class="transaction-info">
      <div class="card-name shop"></div>
      <div class="card-meta date"></div>
    </div>
    <div class="card-limit"></div>
  </div>
</template>

<!-- ブックマーク画面の土台 -->
<template id="tmpl-bookmarks">
  <div>
    <h2 class="page-title">ブックマーク</h2>

    <!-- データなし表示（初期状態は非表示） -->
    <div class="no-data card text-center" style="display:none">ブックマークはありません</div>

    <!-- リスト挿入用コンテナ -->
    <div class="bookmark-list-container"></div>
  </div>
</template>

<!-- ブックマーク1件分のパーツ -->
<template id="tmpl-bookmark-item">
  <div class="card bookmark-item">
    <div class="bookmark-row">
      <!-- 左側：店舗名・日付・詳細メモ -->
      <div class="bookmark-main">
        <div class="shop"></div>
        <div class="date"></div>
        <!-- 詳細/メモ（入力がある場合のみ表示） -->
        <div class="tx-detail" style="display:none"></div>
      </div>

      <!-- 右側：金額 ＆ 操作ボタン -->
      <div class="bookmark-side">
        <div class="tx-amount"></div>
        
        <!-- アイコンボタンエリア（右配置） -->
        <div class="bookmark-actions">
          <button class="btn-edit" title="編集">
            <i class="ph-bold ph-pencil"></i>
          </button>
          <button class="btn-reuse" title="再利用">
            <i class="ph-bold ph-copy"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- 検索画面の土台 -->
<template id="tmpl-search">
  <div>
    <h2 class="page-title">検索</h2>

    <!-- 検索フォーム -->
    <div class="card search-form-card">
      <div class="form-group">
        <label class="form-label">キーワード（購入先・カテゴリ・詳細）</label>
        <input class="form-input" id="search-keyword" type="text" placeholder="例：Amazon、食費" oninput="updateSearch()">
      </div>
      <div class="form-group">
        <label class="form-label">カード</label>
        <select class="form-input" id="search-card" onchange="updateSearch()">
          <option value="">すべて</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">引き落とし年月</label>
        <input class="form-input" id="search-yearmonth" type="month" onchange="updateSearch()">
      </div>
      <div class="search-amount-row">
        <div class="form-group">
          <label class="form-label">金額（下限）</label>
          <input class="form-input" id="search-amount-min" type="number" placeholder="例：1000" oninput="updateSearch()">
        </div>
        <div class="form-group">
          <label class="form-label">金額（上限）</label>
          <input class="form-input" id="search-amount-max" type="number" placeholder="例：10000" oninput="updateSearch()">
        </div>
      </div>
      <button id="btn-clear-search" class="btn btn-ghost btn-full" >
        <i class="ph-bold ph-x"></i> 条件をクリア
      </button>
    </div>

    <!-- 検索結果件数 -->
    <div class="search-count"></div>

    <!-- 検索結果コンテナ -->
    <div id="search-results">
      <!-- 0件時のメッセージ（初期状態は非表示） -->
      <div class="no-data card text-center" style="display:none">条件に一致するデータがありません</div>
      <div class="search-results-list"></div>
    </div>
  </div>
</template>

<!-- 検索結果1件分のパーツ -->
<template id="tmpl-search-item">
  <div class="card transaction-item search-item">
    <div class="transaction-info">
      <div class="shop">
        <span class="shop-name"></span>
        <span class="badge"></span>
      </div>
      <div class="date"></div>
      <div class="tx-detail" style="display:none"></div>
    </div>
    <div class="transaction-amount"></div>
  </div>
</template>

<!-- 削除済み一覧画面の土台 -->
<template id="tmpl-deleted">
  <div>
    <h2 class="page-title page-title-bold">削除済み一覧</h2>
    <div id="deleted-content">
      <div id="deleted-tabs">
        <button id="btn-show-cards" class="btn btn-primary" id="tab-cards" >カード</button>
        <button id="btn-show-transactions" class="btn btn-ghost" id="tab-transactions" >利用データ</button>
      </div>
      <div id="deleted-list"></div>
    </div>
  </div>
</template>

<!-- 削除済みカード1件分パーツ -->
<template id="tmpl-deleted-card-item">
  <div class="card deleted-item">
    <div class="card-header">
      <span class="card-title"></span>
    </div>
    <div class="deleted-item-actions">
      <button class="btn btn-ghost btn-restore">復元</button>
      <button class="btn btn-danger btn-perm-delete">完全削除</button>
    </div>
  </div>
</template>

<!-- 削除済み利用データ1件分パーツ -->
<template id="tmpl-deleted-tx-item">
  <div class="card deleted-item">
    <div class="card-header">
      <span class="card-title"></span>
      <span class="tx-amount"></span>
    </div>
    <div class="deleted-item-actions">
      <button class="btn btn-ghost btn-restore">復元</button>
      <button class="btn btn-danger btn-perm-delete">完全削除</button>
    </div>
  </div>
</template>

<!-- カード追加・編集モーダルのテンプレート -->
<template id="tmpl-card-modal">
  <div class="modal-overlay">
    <div class="modal">
      <div class="modal-title"></div>

      <div class="form-group">
        <label class="form-label">カード名 *</label>
        <input class="form-input" id="card-name" placeholder="例：楽天カード">
      </div>

      <div class="form-group">
        <label class="form-label">カードブランド *</label>
        <input class="form-input" id="card-brand-select" list="brand-list" placeholder="選択または入力">
        <datalist id="brand-list"></datalist>
      </div>

      <div class="form-group">
        <label class="form-label">締め日 *</label>
        <input class="form-input" id="card-closing" type="number" min="1" max="31" placeholder="例：15">
      </div>

      <div class="form-group">
        <label class="form-label">引き落とし日 *</label>
        <input class="form-input" id="card-billing" type="number" min="1" max="31" placeholder="例：27">
      </div>

      <div class="form-group">
        <label class="form-label">利用可能枠（円） *</label>
        <input class="form-input" id="card-limit" type="number" placeholder="例：500000">
      </div>

      <div class="form-group">
        <label class="form-label">引き落とし口座</label>
        <select class="form-input" id="card-bank">
          <option value="">未設定</option>
        </select>
      </div>

      <!-- 編集時のみ表示する削除チェックボックス -->
      <div class="delete-check" style="display:none">
        <input type="checkbox" id="card-delete">
        <label for="card-delete">このカードを削除する</label>
      </div>

      <div class="modal-actions">
        <button id="btn-cancel" class="btn btn-ghost" >キャンセル</button>
        <button id="btn-save" class="btn btn-primary btn-save">保存</button>
      </div>
    </div>
  </div>
</template>

<!-- 利用データ追加・編集モーダルのテンプレート -->
<template id="tmpl-tx-modal">
  <div class="modal-overlay">
    <div class="modal">
      <div class="modal-title"></div>

<div class="form-group">
  <label class="form-label">利用日 *</label>
  <input class="form-input" id="tx-date" type="date">
</div>

<div class="form-group">
  <label class="form-label">カード *</label>
  <select class="form-input" id="tx-card">
    <option value="">選択してください</option>
  </select>
</div>

      <div class="form-group">
        <label class="form-label">金額（円） *</label>
        <input class="form-input" id="tx-amount" type="number" placeholder="例：3000">
      </div>

<div class="form-group suggest-wrap">
  <label class="form-label">購入先</label>
  <input class="form-input" id="tx-shop" placeholder="例：Amazon" autocomplete="off">
  <div class="suggest-list" id="shop-suggest"></div>
</div>

<div class="form-group suggest-wrap">
  <label class="form-label">カテゴリ</label>
  <input class="form-input" id="tx-category" placeholder="例：食費" autocomplete="off">
  <div class="suggest-list" id="category-suggest"></div>
</div>

      <div class="form-group">
        <label class="form-label">詳細</label>
        <textarea class="form-input" id="tx-detail" placeholder="メモなど"></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">引き落とし予定日</label>
        <input class="form-input" id="tx-billing-date" readonly>
      </div>

      <div class="form-group form-group-check">
        <input type="checkbox" id="tx-confirmed">
        <label for="tx-confirmed" class="form-label">確定済み（チェックなし＝未確定）</label>
      </div>

      <div class="form-group form-group-check">
        <input type="checkbox" id="tx-bookmarked">
        <label for="tx-bookmarked" class="form-label">🔖 ブックマーク（再利用したいデータ）</label>
      </div>

      <!-- 編集時のみ表示する削除チェックボックス -->
      <div class="delete-check" style="display:none">
        <input type="checkbox" id="tx-delete">
        <label for="tx-delete">このデータを削除する</label>
      </div>

      <div class="modal-actions">
        <button id="btn-cancel" class="btn btn-ghost" >キャンセル</button>
        <button id="btn-save-modal" class="btn btn-primary btn-save">保存</button>
      </div>
    </div>
  </div>
</template>

<!-- ナビ設定画面の土台 -->
<template id="tmpl-nav-settings">
  <div class="card nav-card-spaced">
  <div class="nav-card-title">テーマカラー</div>
  <div class="theme-row">
    <span>メインカラー</span>
    <input type="color" id="theme-primary">
  </div>
  <div class="theme-row">
    <span>サブカラー</span>
    <input type="color" id="theme-primary-light">
  </div>
  <label class="theme-row">
    <span>サブカラーを自動で作る</span>
    <input type="checkbox" id="theme-auto-light">
  </label>
  <button id="btn-reset-theme" class="btn btn-ghost btn-full">色をリセット</button>
</div>
  <div>
    <h2 class="page-title page-title-tight">ナビ設定</h2>
    <p class="page-desc">ボトムナビの表示・順番を変更できます</p>

    <!-- ボトムナビ設定カード -->
    <div class="card nav-card-spaced">
      <div class="nav-card-title">ボトムナビ（表示/非表示・順番）</div>
      <p class="nav-card-desc">↑↓ボタンで並び替え、チェックで表示切替</p>
      <div class="bottom-nav-list"></div>
    </div>

    <!-- ドロワーメニュー設定カード -->
    <div class="card">
      <div class="nav-card-title">ドロワーメニュー（順番）</div>
      <p class="nav-card-desc">↑↓ボタンで並び替え（全項目常に表示）</p>
      <div class="drawer-nav-list"></div>
    </div>

    <!-- リセットボタン -->
    <button id="btn-reset-nav" class="btn btn-danger btn-full" >
      <i class="ph-bold ph-arrow-counter-clockwise"></i> ナビ設定をリセット
    </button>
  </div>
</template>

<!-- ボトムナビ項目1件分のパーツ -->
<template id="tmpl-nav-setting-bottom-item">
  <div class="nav-setting-item">
    <input type="checkbox" class="nav-visible-check">
    <i class="nav-icon ph-bold"></i>
    <span class="nav-label"></span>
    <div class="nav-setting-item-actions">
      <button class="btn btn-ghost btn-up">↑</button>
      <button class="btn btn-ghost btn-down">↓</button>
    </div>
  </div>
</template>

<!-- ドロワーメニュー項目1件分のパーツ -->
<template id="tmpl-drawer-nav-item">
  <div class="nav-setting-item">
    <i class="nav-icon ph-bold"></i>
    <span class="nav-label"></span>
    <div class="nav-setting-item-actions">
      <button class="btn btn-ghost btn-up">↑</button>
      <button class="btn btn-ghost btn-down">↓</button>
    </div>
  </div>
</template>

<!-- スクリプトソース -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase.js"></script>



<!-- 変更後 -->
<script type="module" src="app.js"></script>

</body>
</html>
